name: Collect day results from backtest runs into a branch
# Copies the per-day events-*.csv.gz artifacts of one or more backtest runs (even cancelled ones) into a git branch,
# rebuilds legs/routes over all of them, and commits everything there. Lets the files be fetched with plain git.
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Backtest run ids, space-separated
        required: true
      branch:
        description: Branch to commit to
        default: history-2025
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download day artifacts from each run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p events
          for id in ${{ inputs.run_ids }}; do
            gh run download "$id" --repo "${{ github.repository }}" --pattern 'events-*' --dir "dl-$id" || echo "run $id: nothing downloaded"
          done
          find dl-* -name 'events-*.csv.gz' -exec cp -n {} events/ \; 2>/dev/null || true
          ls events | wc -l
      - name: Add days already in the branch, rebuild routes
        run: |
          if git ls-remote --exit-code origin "${{ inputs.branch }}" >/dev/null; then
            git fetch --depth 1 origin "${{ inputs.branch }}"
            git archive FETCH_HEAD events | tar -x --skip-old-files 2>/dev/null || true
          fi
          ls events/*.csv.gz | wc -l
          mkdir -p work/events
          for f in events/*.csv.gz; do gunzip -c "$f" > "work/events/$(basename "${f%.gz}")"; done
          cp build_routes.py airports.json work/
          (cd work && python3 build_routes.py)
          mkdir -p out && cp -r events out/ && cp work/routes.json work/legs.csv work/legs_all.csv out/
          gzip -9 out/legs_all.csv
      - name: Commit to the branch
        run: |
          cd out
          git init -q -b "${{ inputs.branch }}"
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git add -A && git commit -qm "Day results from runs ${{ inputs.run_ids }} ($(ls events | wc -l) days)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "${{ inputs.branch }}"
