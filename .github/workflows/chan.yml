name: Bot channel history → air-history + patterns rebuild
# The owner 3 Nov 2026: "the bot should look into all the existing data and feeding history".
# Reads EVERY aircraft post in t.me/s/gulfsituation (the bot's own sightings since it started: Flightradar24 incl. satellite,
# ADS-B Exchange, Wingbits) plus data/oct2026_flight_log.csv (DG / AA tracking), writes air/air-chan-*.csv.gz and
# air/air-log-*.csv.gz to air-history (replacing the previous run's files), then rebuilds map/patterns.json on map-service
# so the bot's tags use it at once. Run on demand; daily.yml rebuilds patterns.json nightly with the same files.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'     # 03:17 UTC, before daily.yml (04:37): yesterday's channel posts are in tonight's rebuild
permissions:
  contents: write
concurrency:
  group: data-branches
  cancel-in-progress: false
jobs:
  chan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel + flight log, update air-history
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 "$R" map-service && git show FETCH_HEAD:map/cities.json > cities.json
          mkdir air && cd air && git init -q -b air-history
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git fetch -q --depth 1 "$R" air-history && git reset -q --hard FETCH_HEAD
          # 28 Nov 2026: posts already read are kept in chan/ on air-history; only the newest are read from t.me each night
          cd .. && mkdir out && python3 chan_history.py out data/oct2026_flight_log.csv cities.json air/chan && cd air
          # 27 Nov 2026 audit: an empty or cut-short read of t.me used to delete the whole channel history with a green run. The old files are replaced only when tonight's read has at least 90 % as many day files.
          new=$(ls ../out/air-chan-*.csv.gz 2>/dev/null | wc -l); old=$(ls air/air-chan-*.csv.gz 2>/dev/null | wc -l)
          if [ "$new" -lt $(( old * 9 / 10 )) ]; then echo "::error::channel read gave $new day files, air-history has $old - history NOT replaced"; exit 1; fi
          mkdir -p air && rm -f air/air-chan-*.csv.gz air/air-log-*.csv.gz && cp ../out/*.csv.gz air/
          git add -A && { git diff --cached --quiet && echo "unchanged"; } || { git commit -qm "Bot channel history + flight log" && git push "$R" HEAD:air-history; }   # a failed push fails the run
      - name: Rebuild map/patterns.json on map-service
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir h && cd h && git init -q -b history-2025 && git fetch -q --depth 1 "$R" history-2025 && git reset -q --hard FETCH_HEAD && cd ..
          mkdir ms && cd ms && git init -q -b map-service
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git fetch -q --depth 1 "$R" map-service && git reset -q --hard FETCH_HEAD
          python3 ../make_patterns.py ../air/air ../h/events ../h/legs_all.csv.gz map/patterns.json
          git add map/patterns.json && { git diff --cached --quiet && echo "unchanged"; } || { git commit -qm "patterns.json: + bot channel history" && git push "$R" HEAD:map-service; }   # a failed push fails the run
