name: Publish backtest result to the results branch
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Backtest run id
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: routes-result
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - name: Commit to the results branch
        run: |
          cd out
          git init -q -b results
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git add -A && git commit -qm "Backtest result from run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results
