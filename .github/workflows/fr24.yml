name: Flightradar24 flight lists → air-history + patterns rebuild
# the owner 3 Nov 2026 "do flightradar": FR24 /data/aircraft/<reg> flight lists for every airframe the bot has posted,
# read in the owner's logged-in Chrome (one flight = one UTC day flown). Sent here by a one-off bot call (repository_dispatch "fr24",
# client_payload.rows = lines "hex:<2-char base-36 days since day 20400>"). Writes air/air-fr24-*.csv.gz (day-only rows) and
# rebuilds map/patterns.json.
on:
  repository_dispatch:
    types: [fr24]
permissions:
  contents: write
concurrency:
  group: data-branches
  cancel-in-progress: false
jobs:
  fr24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write air-fr24 files to air-history
        env:
          ROWS: ${{ github.event.client_payload.rows }}
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          printf '%s\n' "$ROWS" > fr24.txt; wc -l fr24.txt
          mkdir air && cd air && git init -q -b air-history
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git fetch -q --depth 1 "$R" air-history && git reset -q --hard FETCH_HEAD
          mkdir -p air && cd ..
          # add to the stored air-fr24 days, never replace them (4 Nov 2026: a partial dispatch used to delete every other day)
          python3 fr24_history.py fr24.txt data/fr24_regs.json air/air
          cd air
          git add -A && { git diff --cached --quiet && echo "unchanged"; } || { git commit -qm "Flightradar24 flight lists" && git push "$R" HEAD:air-history; }   # a failed push fails the run
      - name: Rebuild map/patterns.json on map-service
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir h && cd h && git init -q -b history-2025 && git fetch -q --depth 1 "$R" history-2025 && git reset -q --hard FETCH_HEAD && cd ..
          mkdir ms && cd ms && git init -q -b map-service
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git fetch -q --depth 1 "$R" map-service && git reset -q --hard FETCH_HEAD
          python3 ../make_patterns.py ../air/air ../h/events ../h/legs_all.csv.gz map/patterns.json
          git add map/patterns.json && { git diff --cached --quiet && echo "unchanged"; } || { git commit -qm "patterns.json: + Flightradar24 flight lists" && git push "$R" HEAD:map-service; }   # a failed push fails the run
