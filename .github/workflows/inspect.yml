name: Coverage check (adsb.lol day, all aircraft over CENTCOM)
# Pattern system step 1 (27 Oct 2026): was a jump in military aircraft over CENTCOM real, or did receivers change?
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days, space-separated (YYYY-MM-DD)
        default: '2026-10-20 2026-10-23 2026-10-26'
permissions:
  contents: write
jobs:
  days:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.d.outputs.list }}
    steps:
      - id: d
        run: echo "list=$(python3 -c "import json;print(json.dumps('${{ inputs.days }}'.split()))")" >> "$GITHUB_OUTPUT"
  check:
    needs: days
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.days.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Stream the day archive into the coverage check
        run: |
          OUT=inspect-${{ matrix.day }}.json
          msg=$(./fetch_day.sh ${{ matrix.day }} "$OUT" python3 inspect_day.py ${{ matrix.day }}) || { echo "$msg"; exit 1; }
          echo "$msg"; TAG=${msg%% *}; SIZE=$(echo "$msg" | sed -E 's/.* ([0-9]+) bytes$/\1/')
          python3 -c "import json;d=json.load(open('$OUT'));d['archive']='$TAG';d['archive_bytes']=$SIZE;json.dump(d,open('$OUT','w'))"
          test -s "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-${{ matrix.day }}
          path: inspect-${{ matrix.day }}.json
          retention-days: 7
  commit:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: inspect-*
          path: out
          merge-multiple: true
      - name: Commit results to the inspect branch
        run: |
          cd out && ls
          git init -q -b inspect
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 "$R" inspect; then git reset -q FETCH_HEAD; fi   # index = branch tree: files not in this run are kept
          git add --ignore-removal . && git commit -qm "Coverage check ${{ inputs.days }}" && git push "$R" HEAD:inspect
