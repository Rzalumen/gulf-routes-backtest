name: Route backtest (adsb.lol history)
on:
  workflow_dispatch:
    inputs:
      start:
        description: First day (YYYY-MM-DD)
        default: '2026-04-23'
      end:
        description: Last day (YYYY-MM-DD)
        default: '2026-10-19'
permissions:
  contents: read
jobs:
  days:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.d.outputs.list }}
    steps:
      - id: d
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json
          a = datetime.date.fromisoformat('${{ inputs.start }}'); b = datetime.date.fromisoformat('${{ inputs.end }}')
          print('list=' + json.dumps([(a + datetime.timedelta(d)).isoformat() for d in range((b - a).days + 1)]))
          EOF
  extract:
    needs: days
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        day: ${{ fromJson(needs.days.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Stream the day archive and keep military / VIP aircraft only
        run: |
          OUT=events-${{ matrix.day }}.csv
          ./fetch_day.sh ${{ matrix.day }} "$OUT" python3 extract_day.py
          gzip -9 "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: events-${{ matrix.day }}
          path: events-${{ matrix.day }}.csv.gz
          retention-days: 14
  build:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: events-*
          path: events
          merge-multiple: true
      - name: Replay every aircraft with the bot's route rules
        run: |
          gunzip events/*.gz
          python3 build_routes.py
          gzip -9k legs.csv legs_all.csv
      - uses: actions/upload-artifact@v4
        with:
          name: routes-result
          path: |
            routes.json
            legs.csv.gz
            legs_all.csv.gz
          retention-days: 30
